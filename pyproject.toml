[project]
name = "gpclean"
version = "0.1.0"
description = "One-time Google Photos cleanup: duplicates, junk, and a guided manual-deletion review."
readme = "README.md"
license = "MIT"
requires-python = "==3.12.*"
dependencies = [
    "pillow==12.3.0",
    "pillow-heif==1.8.0",
    "numpy==2.5.3",
    "tzdata==2026.4",
]

[project.scripts]
gpclean = "gpclean.cli:main"

[dependency-groups]
# CLIP image/text embeddings (pipeline jobs and the Windows review machine).
clip = [
    "torch==2.14.0",
    "torchvision==0.29.0",
    "open_clip_torch==3.3.0",
]
# MCP server (Windows review machine and CI tests only; never in jobs holding Drive tokens).
mcp = ["mcp==2.2.0"]
dev = ["pytest==9.1.1"]

[build-system]
requires = ["uv_build>=0.8.17,<0.9"]
build-backend = "uv_build"

[tool.uv]
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "clip: needs real CLIP weights (network on first run); skipped unless GPCLEAN_TEST_CLIP=1",
    "rclone: needs an rclone binary on PATH or GPCLEAN_RCLONE",
    "slow: slower end-to-end tests",
]
